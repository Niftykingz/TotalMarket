name: Audit eight sample sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source pages (no publishing)
        run: python -m pipeline.examples.audit_v2_sources
      - name: Save blocked/verified evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totalmarket-eight-story-evidence
          path: pipeline/audit-results.json
          if-no-files-found: warn
