name: Publish scheduled global market update
on:
  schedule:
    # 8:49 am IST, with five-minute retries during the 9 am UTC hour if GitHub delays or a check fails.
    - cron: '*/5 3 26 10 *'
concurrency:
  group: totalmarket-main-publisher
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Check requested India time
        id: gate
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          ready = now.date().isoformat() == "2026-10-26" and (now.hour, now.minute) >= (8, 49)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ready={'true' if ready else 'false'}\\n")
          print(f"India time: {now.isoformat()}; ready={ready}")
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Install site build dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pip install pillow numpy matplotlib
      - name: Publish through the verified queue
        if: steps.gate.outputs.ready == 'true'
        run: |
          mv pipeline/drafts/2026-10-26-global-markets-asia-oil-tech-earnings.json pipeline/inbox/
          python3 -m pipeline queue
      - name: Remove this one-time schedule after publication
        if: steps.gate.outputs.ready == 'true' && success()
        run: |
          rm .github/workflows/publish-global-market-2026-10-26.yml
          git config user.name "TotalMarket Bot"
          git config user.email "noreply@totalmarket.co.in"
          git add .github/workflows/publish-global-market-2026-10-26.yml
          git commit -m "Remove one-time global market publishing schedule"
          git push origin main
