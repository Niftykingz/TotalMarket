name: TotalMarket source gate tests
on:
  pull_request:
    paths:
      - 'pipeline/**'
      - 'tests/**'
      - '.github/workflows/source-gate-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install numpy Pillow matplotlib
      - name: Python syntax
        run: python -m compileall -q pipeline tests
      - name: Offline source gate regression tests
        run: python -m unittest discover -s tests -p 'test_source_audit.py' -v && python -m unittest discover -s tests -p 'test_gate_fail_closed.py' -v
      - name: Full test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
