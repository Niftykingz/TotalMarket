name: Preview screenshots
# Manual, draft-only: builds the site from the selected branch into a temp folder, screenshots
# the given pages with a real browser and commits the PNGs to the 'preview-shots' branch.
# Never touches main or docs/.
"on":
  workflow_dispatch:
    inputs:
      pages:
        description: "space-separated path=name pairs"
        default: "tools/preview/symbols.html=symbols"
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy matplotlib playwright && python -m playwright install --with-deps chromium
      - name: Build draft site (not published)
        run: |
          mkdir -p /tmp/site && cp -r docs/. /tmp/site/ && cp -r tools /tmp/site/tools
          TM_BUILD_OUT=/tmp/site python3 build.py || true
      - run: python3 tools/preview/shoot.py /tmp/site /tmp/shots ${{ github.event.inputs.pages }}
      - name: Commit screenshots to preview-shots branch
        run: |
          cd /tmp/shots && git init -q && git checkout -q -b preview-shots
          git add . && git -c user.name="TotalMarket Bot" -c user.email="noreply@anthropic.com" commit -q -m "Preview screenshots ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-shots
