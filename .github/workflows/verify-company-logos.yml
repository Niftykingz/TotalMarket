name: Verify company logos
on:
  pull_request:
    paths:
      - 'logos/**'
      - 'data/company-logos.json'
      - 'scripts/verify-logos.py'
      - '.github/workflows/verify-company-logos.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-logos.py
