name: Collect NSE market datasets
on:
  workflow_dispatch:
  schedule:
    # 16:15 IST on weekdays, after the regular NSE cash close.
    - cron: '45 10 * * 1-5'
permissions:
  contents: read
concurrency:
  group: totalmarket-nse-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collection safeguards
        run: python3 -m unittest discover -s tests -p test_nse_collector.py
      - name: Collect dated exchange observations
        id: collect
        continue-on-error: true
        run: python3 pipeline/market_data/collect_nse.py --output pipeline/market_data/latest.json
      - name: Upload audit snapshot, including partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-market-snapshot
          path: pipeline/market_data/latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail when no exchange datasets are usable
        if: steps.collect.outcome != 'success'
        run: |
          echo "NSE collection failed or returned no dated datasets; no report was published."
          exit 1
