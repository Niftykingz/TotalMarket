name: Collect NSE market datasets
on:
  workflow_dispatch:
    inputs:
      date:
        description: "trading date YYYY-MM-DD (default: today IST)"
        required: false
  schedule:
    # 16:15 IST on weekdays, after the regular NSE cash close.
    - cron: '45 10 * * 1-5'
    # 18:40 IST: NSE publishes provisional FII/DII cash-market figures after 6 pm.
    - cron: '10 13 * * 1-5'
    # Retry late provisional cash flows at 20:10 and 22:10 IST.
    - cron: '40 14,16 * * 1-5'
permissions:
  contents: write  # only to commit the dated audit snapshot under data/market_snapshots/
concurrency:
  group: totalmarket-main-publisher
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collection safeguards
        run: python3 -m unittest discover -s tests -p test_nse_collector.py
      - name: Collect dated exchange observations
        id: collect
        continue-on-error: true
        run: python3 pipeline/market_data/collect_nse.py --output pipeline/market_data/latest.json --archive data/market_snapshots ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
      - name: Report what was collected
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("pipeline/market_data/latest.json")
          if not p.is_file():
              print("::warning title=NSE collection::no snapshot written"); raise SystemExit
          s = json.loads(p.read_text(encoding="utf-8"))
          d = s.get("datasets", {})
          parts = [f"{k}={len(v.get('rows', [])) or v.get('count', 0)}" for k, v in d.items()]
          msg = f"status={s.get('status')} target={s.get('targetDate')} datasets: {', '.join(parts) or 'none'} | errors: {'; '.join(s.get('errors', [])) or 'none'}"
          print(("::notice" if d else "::warning") + " title=NSE collection::" + msg.replace("\n", " ")[:900])
          for name, info in (s.get("diagnostics") or {}).items():
              print(f"::notice title=NSE shape {name}::" + json.dumps(info)[:900])
          PY
      - name: Prepare the weekly report job on the week's last trading day (published by the 17:05 queue run)
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python3 -m pipeline.weekly --only-if-week-end --out pipeline/inbox
      - name: Apply verified same-session observations to website data
        if: steps.collect.outcome == 'success'
        run: |
          D="${{ github.event.inputs.date }}"; D="${D:-$(TZ=Asia/Kolkata date +%F)}"
          python3 -m pipeline.closing --date "$D" --apply-data
      - name: Keep the dated snapshot in the repository (audit trail; never published by itself)
        if: always()
        run: |
          [ -d data/market_snapshots ] || { echo "nothing usable to archive"; exit 0; }
          git config user.name "TotalMarket Bot"; git config user.email "noreply@anthropic.com"
          git add data/market_snapshots data/meta.json data/fii_dii.json data/global.json
          git add pipeline/inbox/*-weekly-market-review.json 2>/dev/null || true
          git diff --cached --quiet && { echo "snapshot unchanged"; exit 0; }
          git commit -q -m "NSE market snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; done
          echo "::warning title=NSE snapshot::could not push the snapshot"; exit 1
      - name: Publish refreshed data through the verified queue
        if: steps.collect.outcome == 'success'
        run: |
          pip install -q pillow numpy matplotlib
          python3 -m pipeline queue
      - name: Build the daily closing drafts (4 graphics + draft article; never published automatically)
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: |
          pip install -q pillow numpy
          D="${{ github.event.inputs.date }}"; D="${D:-$(TZ=Asia/Kolkata date +%F)}"
          python3 -m pipeline.closing --date "$D" --out /tmp/closing-drafts | tee /tmp/closing.txt
          [ -d "/tmp/closing-drafts/$D" ] || exit 0
          echo "::notice title=Closing drafts::$(tr '\n' ' ' < /tmp/closing.txt | cut -c1-800)"
          # Keep only the drafts on a separate branch (last 7 trading days), so main stays small.
          git fetch -q origin closing-drafts:refs/remotes/origin/closing-drafts 2>/dev/null || true
          W=/tmp/drafts-branch; rm -rf $W; mkdir -p $W
          if git rev-parse -q --verify origin/closing-drafts >/dev/null; then git archive origin/closing-drafts | tar -x -C $W; fi
          rm -rf "$W/$D"; cp -r "/tmp/closing-drafts/$D" "$W/$D"
          ls -1d $W/20* 2>/dev/null | sort | head -n -7 | xargs -r rm -rf
          printf '# Daily closing drafts\n\nGenerated after the NSE close; review, then ask for publication. Nothing here is live.\n' > $W/README.md
          cd $W && git init -q && git checkout -q -b closing-drafts && git add -A
          git -c user.name="TotalMarket Bot" -c user.email="noreply@anthropic.com" commit -q -m "Closing drafts $D"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" closing-drafts
      - name: Upload audit snapshot, including partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-market-snapshot
          path: pipeline/market_data/latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail when no exchange datasets are usable
        if: steps.collect.outcome != 'success'
        run: |
          echo "NSE collection failed or returned no dated datasets; no report was published."
          exit 1
