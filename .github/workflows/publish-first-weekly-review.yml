name: Publish first weekly review
"on":
  push:
    paths:
      - '.github/workflows/publish-first-weekly-review.yml'
      - 'pipeline/core.py'
      - 'build.py'
      - 'report.py'
      - 'docs/assets/style.css'
      - 'pipeline/source_audit.py'
      - 'pipeline/config.json'
      - 'pipeline/examples/prepare_first_weekly.py'
      - 'tests/test_graphics_v2.py'
  workflow_dispatch:
concurrency:
  group: totalmarket-main-publisher
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy matplotlib
      - name: Prepare source-backed weekly article job
        run: python3 pipeline/examples/prepare_first_weekly.py
      - name: Verify article and render graphic
        run: python3 -m pipeline run pipeline/inbox/2026-10-23-weekly-market-review.json
      - name: Verify site build without publishing
        run: python3 -m pipeline publish --dry-run
      - name: Publish only after all checks
        run: |
          python3 -m pipeline publish -m "Weekly market review: 19–23 October 2026"
# Retry with source-supported benchmark figures only.
